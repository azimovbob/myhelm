replicaCount: 1

image:
  repository: siddharth67/block-buster-dev:7.6.0
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

namespace:
  name: demo-app

labels:
  app:
    name: bb-app
    version: 7.x.x
    env: uat

customers:
  test-customer:
    id: "17"
    services:
      spark-api:
        enabled: false
        adminPort: 11873
      cdp-query-api:
        enabled: false
        adminPort: 11876
      data-pipeline:
        enabled: false
        adminPort: 11806
  learniq:
    id: "32"
    services:
      spark-api:
        enabled: false
        adminPort: 14073
      cdp-query-api:
        enabled: false
        adminPort: 14076
      data-pipeline:
        enabled: false
        adminPort: 14006
